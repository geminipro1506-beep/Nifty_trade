name: Android Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Determine Version & Release Tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            NAME="Cloudscope Money Printer $TAG"
          else
            TAG="v1.0.${{ github.run_number }}"
            NAME="Cloudscope Money Printer v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$NAME" >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --console=plain --stacktrace

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Sign Release APK with Custom Keystore (Optional)
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE_BASE64 }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release APK Artifact
        id: prep_apk
        run: |
          TAG="${{ steps.release_info.outputs.tag_name }}"
          if [ -n "${{ steps.sign_app.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            SRC="${{ steps.sign_app.outputs.signedReleaseFile }}"
          else
            SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          
          mkdir -p release-artifacts
          TARGET="release-artifacts/Cloudscope-Money-Printer-${TAG}.apk"
          cp "$SRC" "$TARGET"
          echo "apk_path=$TARGET" >> $GITHUB_OUTPUT
          echo "apk_name=Cloudscope-Money-Printer-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudscope-money-printer-${{ steps.release_info.outputs.tag_name }}
          path: ${{ steps.prep_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          files: ${{ steps.prep_apk.outputs.apk_path }}
          body: |
            ### Cloudscope Money Printer ⚡
            Automated production build for NIFTY Intraday Options Intelligence.
            
            - **Commit**: `${{ github.sha }}`
            - **Trigger**: `${{ github.event_name }}` on `${{ github.ref_name }}`
            - **APK Asset**: `${{ steps.prep_apk.outputs.apk_name }}`
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
